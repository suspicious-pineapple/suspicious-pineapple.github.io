let distort = gpu.createKernel(function(time,waveSources,numSources) {
    
    let shiftTotalX = 0;
    let shiftTotalY = 0;
    let totalMag = 0;
    for(let i = 0; i < numSources*6;i+=6){

        let mag = waveSources[i+2];
        const freq = waveSources[i+3];
        const spawnTime = waveSources[i+4];
        const deathTime = waveSources[i+5];
        const timeToLive = deathTime-time;
        const xDiff = waveSources[i+0]-this.thread.x;
        const yDiff = waveSources[i+1]-this.thread.y;
        
        let c = 75;
        
        const dist = Math.sqrt(xDiff*xDiff+yDiff*yDiff)+2;

        const invDist = 1/dist;
        const timeToLiveAdj = timeToLive+(dist/c);
        let shiftDir = Math.atan2(xDiff, yDiff);



        mag = mag*Math.sin(-time*freq+dist/(freq*0.5))*(invDist);

        let shiftX = Math.sin(shiftDir);
        let shiftY = Math.cos(shiftDir);

        let overdrawBudget = 0.9;

        if((time - spawnTime)*c < dist){
            mag = 0;
        } else if(timeToLiveAdj <0) {
            let overdraw = (overdrawBudget-Math.min(-timeToLiveAdj,overdrawBudget))/overdrawBudget;
            mag=mag*overdraw;
        }
        totalMag+=mag;
        shiftTotalX+=shiftX*mag;
        shiftTotalY+=shiftY*mag;
    }
    
    let pixelX = shiftTotalX;
    let pixelY = shiftTotalY;
    let packed = ((totalMag+256)&0xFFFF)<<16 | (pixelX&0xFF)<<8 | pixelY&0xFF;
    return packed;
},{
    "dynamicArguments":true,
    "pipeline":true,
    "precision":"single",
    "tactic":"speed"
})

    //if(pixel[3]==1&&(pixel[1]*0.1>(Math.sin(this.thread.x*Math.cos(this.thread.y)*2)))){

let fishContext = fishCanvas.getContext("2d"); 

function drawFish(x,y,angle,curvature,segments,redchannel=190){
    fishContext.translate(x,y);
    fishContext.rotate(angle);

    let findex = {
        start:2,
        end:7
    }

    let currentX = 0;
    let currentY = 0;
    let pathPointsLeft = [];
    let pathPointsRight = [];
    let finPath = new Path2D();

    for(let i = 0; i < segments.length;i++){
        let currentAngle = ((curvature/segments.length)*i)-curvature/2;
        let newCenter = getNextCoord(currentX,currentY,currentAngle,segments[i][1]);
        //console.log(newCenter);
        let sidewaysPoints = getSidewaysCoords(newCenter.x,newCenter.y,currentAngle,segments[i][0]);
        pathPointsLeft.push([sidewaysPoints.x1,sidewaysPoints.y1]);
        pathPointsRight.push([sidewaysPoints.x2,sidewaysPoints.y2]);
        if(i>=findex.start&&i<findex.end){
            finPath.lineTo(newCenter.x,newCenter.y);
        }
        currentX = newCenter.x;        
        currentY = newCenter.y;


    }
    //console.log(pathPointsLeft,pathPointsRight);
    //fishContext.beginPath();
    //fishContext.moveTo(0,segments[0])
    
    let fishPath = new Path2D();
    fishPath.moveTo(0,0);

    for(let p of pathPointsLeft){
        //fishContext.lineTo(p[0],p[1]);
        fishPath.lineTo(p[0],p[1]);
    }
    //fishContext.moveTo(0,-segments[0]);
    
    pathPointsRight.reverse();
    for(let p of pathPointsRight){
        fishPath.lineTo(p[0],p[1]);
        //fishContext.lineTo(p[0],p[1]);
    }
    //fishPath.moveTo(0,-segments[0]);
    fishPath.closePath();
    
    fishContext.fillStyle="rgba("+redchannel+",180,200,256)";
    fishContext.lineWidth=4;
    fishContext.strokeStyle="rgba(180,140,210,256)";
    fishContext.fill(fishPath);
    fishContext.stroke(finPath)
    
    let eyeSeg = getNextCoord(0,0,(curvature/segments.length)*8,14);
    let eyePoints = getSidewaysCoords(eyeSeg.x,eyeSeg.y,(curvature/segments.length)*7,5);
    
    fishContext.strokeStyle="rgba(70,169,210)";
    fishContext.beginPath();
    fishContext.arc(eyePoints.x1,-eyePoints.y1,0.5,0,Math.PI*2);
    fishContext.stroke();
    fishContext.beginPath();
    fishContext.arc(eyePoints.x2,-eyePoints.y2,0.5,0,Math.PI*2);
    fishContext.stroke();
    //fishContext.closePath();

    //fishContext.stroke();



    fishContext.resetTransform();

    function getSidewaysCoords(currentX,currentY,currentAngle,radius){
        let x1 = currentX+Math.cos(currentAngle+Math.PI/2)*radius;
        let x2 = currentX+Math.cos(currentAngle-Math.PI/2)*radius;
        let y1 = currentY+Math.sin(currentAngle+Math.PI/2)*radius;
        let y2 = currentY+Math.sin(currentAngle-Math.PI/2)*radius;
        return {x1,x2,y1,y2};
    }

    function getNextCoord(startx,starty,curve,length){
        let xdiff = Math.cos(curve)*length;
        let ydiff = Math.sin(curve)*length;
        return {x:startx+xdiff,y:starty+ydiff};

    }
}
let numFish = 0;
class Fish {
    constructor(x,y,angle,shape=[[7,8],[12,14],[14,10],[20,2],[24,3],[22,2],[15,10],[16,10],[17,10],[15,10],[10,18],[12,10],[7,4],[1,4]]){
        this.x=x;
        this.y=y;
        this.r = Math.hypot(x,y);
        this.angle=angle;
        this.shape=shape;
        this.phase=Math.random()*Math.PI;
        this.speed = 1 + (Math.random()-0.5)*0.5
        this.fishIndex = numFish;
        numFish++;
        numFish++;
    }
    render(){

        this.x = Math.cos((simulationTime*this.speed)/9)*this.r + 256;
        this.y = Math.sin((simulationTime*this.speed)/9)*this.r + 256;
        this.angle = (simulationTime*this.speed)/9-Math.PI/2;
        this.curve = Math.sin(simulationTime/0.6+this.phase)*0.8


        drawFish(this.x,this.y,this.angle,this.curve, this.shape, this.fishIndex);
    }
    randomShape(segments,maxwidth,maxlength){
        let shape = [];
        for(let i = 0; i < segments; i++){
            shape.push([Math.random()*maxwidth,Math.random()*maxlength]);
        }
        this.shape=shape;

        return this;
    }
    serialize(){
        let data = [];
        data.push(this.y);
        data.push(this.x);
        data.push(this.angle);
        return data;
    }

}

        function getMousePosition(canvas, event) {
            let rect = canvas.getBoundingClientRect();
            let x = event.clientX - rect.left;
            let y = event.clientY - rect.top;
            return {x,y};
        }
